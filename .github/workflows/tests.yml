name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --collect-only -q
      - run: pytest -m unit -v

  integration:
    name: Integration / dedicated test account
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: yandex-disk-integration
      cancel-in-progress: false
    env:
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
    steps:
      - name: Require integration secret
        shell: bash
        run: |
          if [ -z "${YANDEX_DISK_TOKEN//[[:space:]]/}" ] || [ "$YANDEX_DISK_TOKEN" = "your_token_here" ]; then
            echo 'Set repository secret YANDEX_DISK_TOKEN for a dedicated test account.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: pytest -m 'integration and not concurrency' -v
