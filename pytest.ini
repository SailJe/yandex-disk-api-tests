[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config --tb=short
markers =
    integration: real Yandex Disk API requests
    unit: offline checks of the client and fixture failure handling
    smoke: basic resource and file operations
    negative: invalid requests and state preservation after failures
    auth: authorization checks
    e2e: complete file lifecycle
    concurrency: reserved; no production load or concurrent scenarios implemented
