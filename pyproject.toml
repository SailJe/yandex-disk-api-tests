[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-disk-api-tests"
version = "1.0.0"
description = "Isolated pytest integration tests for the Yandex Disk REST API"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3,<10",
    "requests>=2.32.4,<3",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
